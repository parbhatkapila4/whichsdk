name: auth-nextjs
category: auth
competitors:
  - name: Clerk
    npm_packages:
      - "@clerk/nextjs"
  - name: Better Auth
    npm_packages:
      - better-auth
  - name: Auth.js
    npm_packages:
      - next-auth
  - name: Supabase Auth
    npm_packages:
      - "@supabase/ssr"
starter_template: templates/nextjs-starter
tasks:
  - >-
    Add authentication to this app. People should be able to sign up with an email and
    password, log in and log out, and I want a /dashboard page that only logged-in users can see.
  - >-
    I want users to be able to sign in with Google and GitHub. Once they're signed in, show their
    name and avatar in the header with a sign out button next to it.
  - >-
    need login for this app, nothing fancy. make /account only work if you're signed in and show
    the user's email on it
agents:
  - name: claude_code
    model: claude-sonnet-5-5
repeats: 3
timeout_seconds: 1800
max_turns: 60
run_budget_usd: 1.00
study_budget_usd: 10.00
