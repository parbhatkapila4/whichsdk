[project]
name = "whichsdk"
version = "0.1.0"
description = "Measure which SDK a coding agent installs when asked to build something."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
whichsdk = "whichsdk.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "ARG", "RUF", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
